# Abre un Pull Request automáticamente cada vez que se hace push a una rama.
#
#   feature/* (o cualquier otra rama) -> development
#   development                       -> testing
#   testing                           -> stagin
#   stagin                            -> main
#   main                              -> (no abre nada, es el final del flujo)
#
# Quién puede mergear cada PR NO se define aquí, sino en la protección de ramas:
# Settings > Branches.
name: Auto PR

on:
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    # No hacer nada cuando el push es el borrado de una rama.
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Abrir PR hacia la rama siguiente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          case "$HEAD_BRANCH" in
            development) BASE=testing ;;
            testing)     BASE=stagin ;;
            stagin)      BASE=main ;;
            *)           BASE=development ;;
          esac

          # Una rama nueva sin commits propios no tiene nada que proponer.
          AHEAD=$(gh api "repos/$GH_REPO/compare/$BASE...$HEAD_BRANCH" --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "$HEAD_BRANCH no tiene commits nuevos respecto a $BASE."
            exit 0
          fi

          # Si ya hay un PR abierto, los commits nuevos se suman a ese mismo PR.
          OPEN=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "Ya existe un PR abierto de $HEAD_BRANCH hacia $BASE."
            exit 0
          fi

          gh pr create \
            --head "$HEAD_BRANCH" \
            --base "$BASE" \
            --title "$HEAD_BRANCH -> $BASE" \
            --body "PR abierto automáticamente por el workflow Auto PR."
